---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: forecaster-resource-quota
  namespace: forecaster
  labels:
    app.kubernetes.io/name: probabilistic-forecaster
    app.kubernetes.io/component: resource-management
spec:
  hard:
    requests.cpu: "8"
    limits.cpu: "16"
    requests.memory: 32Gi
    limits.memory: 64Gi
    requests.nvidia.com/gpu: "4"
    pods: "20"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: forecaster-limit-range
  namespace: forecaster
  labels:
    app.kubernetes.io/name: probabilistic-forecaster
    app.kubernetes.io/component: resource-management
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 4Gi
      defaultRequest:
        cpu: "500m"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 32Gi
        nvidia.com/gpu: "1"
      min:
        cpu: "100m"
        memory: 128Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 32Gi
