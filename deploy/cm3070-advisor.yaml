apiVersion: v1
kind: ServiceAccount
metadata:
  name: cm3070-advisor
  namespace: cm3070
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cm3070-advisor-cache
  namespace: cm3070
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cm3070-advisor
  namespace: cm3070
  labels:
    app.kubernetes.io/name: cm3070-advisor
    app.kubernetes.io/part-of: cm3070-final-project
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cm3070-advisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cm3070-advisor
    spec:
      serviceAccountName: cm3070-advisor
      imagePullSecrets:
        - name: ecr-registry-credentials
      volumes:
        - name: tick-cache
          persistentVolumeClaim:
            claimName: cm3070-advisor-cache
      containers:
        - name: advisor
          image: 731833471586.dkr.ecr.ap-southeast-1.amazonaws.com/forex-cm3070-advisor:latest
          imagePullPolicy: Always
          env:
            - name: LLM_BASE_URL
              value: http://gemma-4-31b-predictor.peterbean.svc.cluster.local/v1
            - name: LLM_MODEL
              value: gemma-4-31b-it
          envFrom:
            - secretRef:
                name: cm3070-advisor-secrets
          volumeMounts:
            - name: tick-cache
              mountPath: /app/feature-prototype/cache
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
