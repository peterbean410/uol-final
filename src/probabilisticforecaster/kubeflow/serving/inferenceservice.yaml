apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: forecaster-usdjpy-h1
  namespace: kubeflow
  labels:
    app: probabilistic-forecaster
    component: serving
  annotations:
    # Autoscaling configuration
    serving.kserve.io/autoscalerClass: kpa.autoscaling.knative.dev
    serving.kserve.io/targetUtilizationPercentage: "70"
    # Prometheus metrics scraping
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 4
    scaleTarget: 10
    scaleMetric: concurrency
    # Scale to zero after 5 minutes idle
    annotations:
      autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
      autoscaling.knative.dev/metric: concurrency
      autoscaling.knative.dev/target: "10"
      autoscaling.knative.dev/scale-to-zero-pod-retention-period: "5m"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - rpivn
                    - beanpi03
    containers:
      - name: forecaster-predictor
        image: 731833471586.dkr.ecr.ap-southeast-1.amazonaws.com/forecaster-serving:latest
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
        env:
          - name: MODEL_PATH
            value: "s3://prod-fintech-forex-sg-731833471586/models/forecaster/latest/model.pt"
          - name: STORAGE_URI
            value: "s3://prod-fintech-forex-sg-731833471586/models/forecaster/latest"
    canaryTrafficPercent: 0
