---
# Flux image automation for the modelenv sidecar image.
#
# Problem this solves: the modelenv container in inferenceservice.yaml is pinned
# to `modelenv:latest`. Because the manifest text never changes when CI pushes a
# new `latest`, Flux sees no diff and never rolls the pod, so the running server
# keeps serving stale code. These three objects let Flux detect a freshly built
# image and write the concrete tag back into git, which then drives a rollout.
#
# Pipeline: gitea CI (.gitea/workflows/modelenv-build.yml) builds and pushes
#   `modelenv:<YYYYMMDDHHMM>` + `:latest` to ECR
#   → ImageRepository scans ECR tags
#   → ImagePolicy selects the newest YYYYMMDDHHMM tag
#   → ImageUpdateAutomation rewrites the `$imagepolicy` setter in
#     inferenceservice.yaml and pushes the commit to master
#   → the dqnpf-intraday Kustomization reconciles the changed manifest
#   → KServe rolls the predictor pod, which pulls the new image.
#
# Prerequisites (configured once on the cluster, NOT in this file):
#   - image-reflector-controller must be able to read the private ECR repo. With
#     `provider: aws` it uses the controller's IAM identity (IRSA on its service
#     account, or the node role); that identity needs ecr:GetAuthorizationToken
#     and read on the modelenv repository.
#   - The `flux-system` secret referenced by the GitRepository below must have
#     WRITE access to the gitea repo so ImageUpdateAutomation can push commits.
#
# Like DqnpfIntraday.yaml, this manifest is bootstrapped from the Platform/fluxcd
# repo (app/base/), not reconciled by the dqnpf-intraday Kustomization itself.

apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: modelenv
  namespace: flux-system
spec:
  image: 731833471586.dkr.ecr.ap-southeast-1.amazonaws.com/modelenv
  interval: 5m
  provider: aws
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: modelenv
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: modelenv
  # CI emits build tags as a 12-digit UTC timestamp (date +%Y%m%d%H%M). Match
  # only those so `:latest` and any other floating tags are ignored, then pick
  # the numerically highest = most recently built.
  filterTags:
    pattern: '^[0-9]{12}$'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1beta1
kind: ImageUpdateAutomation
metadata:
  name: modelenv
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: fintech-forex-dqnpf
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.peterbean.net
      messageTemplate: |
        chore(deploy): bump modelenv image

        Automated by Flux image-automation.
        {{range .Changed.Changes}}{{print .OldValue}} -> {{println .NewValue}}{{end}}
    push:
      branch: master
  update:
    path: ./tradingmodel/intraday/dqnpf/kubeflow/manifests
    strategy: Setters
