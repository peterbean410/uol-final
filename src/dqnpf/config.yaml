# DQN + ProbabilisticForecaster Integration Layer - Default Configuration

# Environment
grpc_address: "localhost:50051"
symbol: "USDJPY"
step_size_seconds: 60

# Screening thresholds
variance_threshold: 4.5
max_risk_long_units: 2
max_risk_short_units: 1

# Forecaster
forecast_horizon: 1
min_bars_warmup: 1440

# Checkpoints
dqn_checkpoint_path: null
forecaster_checkpoint_path: null

# Compute
device: "auto"

# Episode / backtest run parameters
num_episodes: 1
episode_start_ts: 0
episode_end_ts: 0
seed: 0
