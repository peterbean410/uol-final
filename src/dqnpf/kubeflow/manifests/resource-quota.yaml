# dqnpf-intraday namespace resource quota.
#
# Limits total resource consumption across the dqnpf-intraday namespace
# to prevent runaway workloads from consuming unbounded cluster resources.
#
# Requirements: 24.5
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dqnpf-intraday-quota
  namespace: dqnpf-intraday
  labels:
    app.kubernetes.io/name: dqnpf-intraday
    app.kubernetes.io/component: resource-management
    app.kubernetes.io/part-of: fintech-forex
    app.kubernetes.io/managed-by: fluxcd
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "4"
    limits.memory: 8Gi
