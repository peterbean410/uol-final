syntax = "proto3";

package environment;

service Environment {
  rpc Reset(ResetRequest) returns (Observation);
  rpc Step(Action) returns (StepResponse);
  rpc Observe(ObserveRequest) returns (Observation);
  rpc StreamObservations(ObserveRequest) returns (stream Observation);
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_TRAINING = 1;
  MODE_LIVE = 2;
}

enum ActionType {
  ACTION_HOLD = 0;
  ACTION_OPEN_BUY = 1;
  ACTION_CLOSE_MOST_LOSS = 2;
  ACTION_CLOSE_MOST_PROFIT = 3;
  ACTION_CLOSE_ALL_LOSS = 4;
  ACTION_CLOSE_ALL_PROFIT = 5;
}

enum TimeInterval {
  TIME_INTERVAL_UNSPECIFIED = 0;
  TIME_INTERVAL_M1 = 1;
  TIME_INTERVAL_M5 = 2;
  TIME_INTERVAL_M15 = 3;
  TIME_INTERVAL_H1 = 4;
  TIME_INTERVAL_H4 = 5;
  TIME_INTERVAL_D1 = 6;
  TIME_INTERVAL_W1 = 7;
  TIME_INTERVAL_MN = 8;
}

message ResetRequest {
  string symbol = 1;
  int64 episode_start_ts = 2;
  int64 episode_end_ts = 3;
  int64 seed = 4;
}

message ObserveRequest {
  string symbol = 1;
}

message Action {
  ActionType action = 1;
  string client_order_id = 2;
}

message Bar {
  int64 timestamp_ns = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
}

message Position {
  string position_id = 1;
  double entry_price = 2;
  double unrealised_pnl = 3;
  double swap = 4;
  int64 open_timestamp_ns = 5;
  double volume = 6;
  int32 side = 7;  // 0=BUY, 1=SELL
}

message Fill {
  string order_id = 1;
  int64 timestamp_ns = 2;
  double price = 3;
  double size = 4;
  ActionType side = 5;
  bool partial = 6;
}

message News {
  int64 timestamp_ns = 1;
  string headline = 2;
  double sentiment_score = 3;
  string source = 4;
}

message Tick {
  int64 timestamp_ns = 1;
  double price = 2;
  double size = 3;
}

message BarList {
  repeated Bar bars = 1;
}

message Observation {
  int64 timestamp_ns = 1;
  string symbol = 2;
  map<string, Bar> live_bars = 3;
  map<string, BarList> recent_bars = 4;
  repeated Position positions = 5;
  double realised_pnl_12m = 9;
  repeated Fill recent_fills = 6;
  repeated double indicators = 7;
  repeated Tick recent_ticks = 10;
  repeated Tick live_ticks = 11;
  repeated News recent_news = 12;
  bool done = 8;
}

message StepResponse {
  Observation observation = 1;
  double reward = 2;
  bool done = 3;
  string info = 4;
}
