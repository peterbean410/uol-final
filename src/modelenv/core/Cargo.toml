[package]
name = "modelenv-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
arrow = "53.0"
parquet = "53.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
modelenv-proto = { path = "../proto" }
bytes = "1.0"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3.13"
