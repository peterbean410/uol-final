
grpc_address: "localhost:50051"
symbol: "USDJPY"
episode_start_ts: 0
episode_end_ts: 0
step_size_seconds: 5

gamma: 0.999
epsilon_start: 1.0
epsilon_end: 0.05               # sustained exploration floor (~5% random actions throughout)
epsilon_decay_steps: 0          # 0 = auto: anneal over the full step budget (total_episodes x steps/episode)
batch_size: 64
replay_buffer_size: 300000
target_update_freq: 1000
train_freq: 4
tau: 1.0

hidden_dims: [256, 256, 128]
activation: "relu"
dropout: 0.0
learning_rate: 0.0001
betas: [0.9, 0.999]
eps: 0.00000001
weight_decay: 0.0
grad_clip_norm: 10.0
loss_function: "huber"

max_steps_per_episode: 30000
checkpoint_interval: 50
checkpoint_dir: "deepqnetwork/checkpoints/"
log_interval: 10                # episodes between episode-summary logs
progress_log_interval: 1000     # steps between intra-episode progress logs (0 disables)

mode: "train"
checkpoint: null
device: "auto"

s3_checkpoint_prefix: null
model_version: null
