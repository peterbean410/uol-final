---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dqn-resource-quota
  namespace: forecaster-workloads
  labels:
    app.kubernetes.io/name: dqn-advisor
    app.kubernetes.io/component: resource-management
spec:
  hard:
    requests.cpu: "12"
    limits.cpu: "24"
    requests.memory: 48Gi
    limits.memory: 96Gi
    requests.nvidia.com/gpu: "2"
    pods: "16"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: dqn-limit-range
  namespace: forecaster-workloads
  labels:
    app.kubernetes.io/name: dqn-advisor
    app.kubernetes.io/component: resource-management
spec:
  limits:
    - type: Container
      default:
        cpu: "2"
        memory: 8Gi
      defaultRequest:
        cpu: "1"
        memory: 4Gi
      max:
        cpu: "4"
        memory: 32Gi
        nvidia.com/gpu: "1"
      min:
        cpu: "100m"
        memory: 256Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 64Gi
