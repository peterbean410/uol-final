apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize entrypoint for the Probabilistic Forecaster ML pipeline.
# Referenced by FluxCD via app/base/ProbabilisticForecaster.yaml.

namespace: forecaster

resources:
  - namespace.yaml
  - resource_quotas.yaml
  # Note: No InferenceService, Forecaster serving is consolidated under
  # dqnpf-intraday (see kubeflow-ml-pipeline spec, Requirement 5 deprecation).
  # ../monitoring/prometheus_rules.yaml, Removed: PrometheusRule CRD
  # (monitoring.coreos.com/v1) not installed on this cluster. The rules
  # were blocking the probabilistic-forecaster Kustomization dry-run,
  # which blocked app health check, which blocked all app reconciliation.
  # Prometheus rules are now in dqnpf-intraday monitoring (Task 31.5).
  - pytorchjob.yaml

commonLabels:
  app.kubernetes.io/name: probabilistic-forecaster
  app.kubernetes.io/part-of: fintech-forex
  app.kubernetes.io/managed-by: fluxcd
