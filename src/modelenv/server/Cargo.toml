[package]
name = "modelenv-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "modelenv-server"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tonic = "0.12"
prost = "0.13"
async-trait = "0.1"
modelenv-proto = { path = "../proto" }
modelenv-core = { path = "../core" }
