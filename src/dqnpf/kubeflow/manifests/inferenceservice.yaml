apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: dqnpf-intraday-predictor
  namespace: dqnpf-intraday
  labels:
    app.kubernetes.io/name: dqnpf-intraday
    app.kubernetes.io/component: serving
    app.kubernetes.io/part-of: fintech-forex
    app.kubernetes.io/managed-by: fluxcd
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  predictor:
    minReplicas: 0
    maxReplicas: 2
    scaleTarget: 5
    scaleMetric: concurrency
    annotations:
      autoscaling.knative.dev/class: kpa.autoscaling.knative.dev
      autoscaling.knative.dev/metric: concurrency
      autoscaling.knative.dev/target: "5"
      autoscaling.knative.dev/scale-to-zero-pod-retention-period: "5m"
      dqnpf.fintech/redeploy: "2026-06-20T15-session-gate"
    tolerations:
      - key: arch
        operator: Equal
        value: arm64
        effect: NoExecute
      - key: workload
        operator: Equal
        value: ml
        effect: NoExecute
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/hostname
                  operator: NotIn
                  values:
                    - rpivn
                    - beanpi01
                    - beanpi02
                    - beanpi03
    containers:
      - name: kserve-container
        image: 731833471586.dkr.ecr.ap-southeast-1.amazonaws.com/dqnpf-intraday-predictor:latest
        ports:
          - containerPort: 8080
            protocol: TCP
        resources:
          requests:
            cpu: "0.5"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        env:
          - name: GRPC_ADDRESS
            value: "localhost:50051"
          - name: DEVICE
            value: "cpu"
          - name: DQN_MODEL_REGISTRY_NAME
            value: "deepqnetwork-usdjpy"
          - name: FORECASTER_MODEL_REGISTRY_NAME
            value: "probabilistic-transformer-usdjpy-h1"
          - name: MODEL_REGISTRY_URL
            value: "http://model-registry-service.kubeflow.svc.cluster.local:8080"
          - name: MINIO_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: mlpipeline-minio-artifact
                key: accesskey
          - name: MINIO_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: mlpipeline-minio-artifact
                key: secretkey
      - name: modelenv
        image: 731833471586.dkr.ecr.ap-southeast-1.amazonaws.com/modelenv:202608030952 # {"$imagepolicy": "flux-system:modelenv"}
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "2"
            memory: 4Gi
