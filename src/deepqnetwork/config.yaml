# Deep Q-Network Trading Agent - Default Configuration

# Environment
grpc_address: "localhost:50051"
symbol: "USDJPY"
episode_start_ts: 0
episode_end_ts: 0
step_size_seconds: 5

# Agent
gamma: 0.99
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay_steps: 50000
batch_size: 64
replay_buffer_size: 300000
target_update_freq: 1000
train_freq: 4
tau: 1.0

# Network
hidden_dims: [256, 256, 128]
activation: "relu"
layer_norm: true
dropout: 0.0
dueling: false
learning_rate: 0.0001
betas: [0.9, 0.999]
eps: 0.00000001
weight_decay: 0.0
grad_clip_norm: 10.0
loss_function: "huber"

# Training
num_episodes: 3000
max_steps_per_episode: 30000
checkpoint_interval: 50
checkpoint_dir: "deepqnetwork/checkpoints/"
log_interval: 10

# Mode
mode: "train"
checkpoint: null
device: "auto"

# S3
s3_checkpoint_prefix: null
model_version: null
