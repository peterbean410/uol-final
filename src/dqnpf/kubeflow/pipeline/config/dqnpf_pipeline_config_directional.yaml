# dqnpf-intraday Pipeline Configuration, Directional-disagreement variant
#
# Identical to dqnpf_pipeline_config.yaml EXCEPT directional_disagreement=true.
# Purpose: test whether letting the forecaster veto trades whose direction it
# disagrees with (Rule 2 in IntegrationLayer.screen) actually improves the real
# (currently negative) PnL. Unlike the variance-budget gate, this rule does NOT
# depend on sigma crossing variance_threshold, so it should engage even though
# the forecaster's sigma never exceeds 4.5 in the default run.
#
# Keep every other field byte-identical to the default config so the only
# difference between this run and the baseline run is the directional veto.

# --- Mirrored IntegrationConfig fields ---
symbol: "USDJPY"
variance_threshold: 4.5
max_risk_long_units: 2
max_risk_short_units: 1
directional_disagreement: true   # <-- the only change vs the default config
directional_tolerance: 1.0       # bps deadband: |mu| must exceed this to veto
forecast_horizon: 1
min_bars_warmup: 1440
step_size_seconds: 60
dqn_checkpoint_path: null      # resolved from Model Registry at runtime
forecaster_checkpoint_path: null
device: "auto"
grpc_address: "localhost:50051"
num_episodes: 1
# Out-of-sample validation window: the calendar month immediately after the
# DQN training dataset (trained on 2012-01-04..2012-01-31). Unix seconds, UTC.
episode_start_ts: 1328054400  # 2012-02-01 00:00:00 UTC
episode_end_ts: 1330560000    # 2012-03-01 00:00:00 UTC
seed: 0

# --- Pipeline-level fields ---
dqn_model_registry_name: "deepqnetwork-usdjpy"
forecaster_model_registry_name: "probabilistic-transformer-usdjpy-h1"
dqn_lifecycle_stage: "production"
forecaster_lifecycle_stage: "production"
gpu_enabled: false
max_wall_time_hours: 4
