
symbol: "USDJPY"
forecast_horizon: 1          # 1, 3, 6, 12 bars ahead
lookback_window: 36          # 3 hours of 5-min bars
historical_window: 1440      # 5 days × 288 bars
num_features: 16
num_layers: 3
num_heads: 4
d_ff: 64                     # Feed-forward hidden dimension
dropout: 0.1
learning_rate: 0.001
batch_size: 64
epochs: 5
random_seed: 42

train_start: "2012-01-01"
train_end: "2022-12-31"
test_start: "2023-01-01"
test_end: "2026-04-30"

data_start: "2012-01-01"
train_pct: 0.75             # 75% of total history for training
test_pct: 0.25              # 25% of total history for test/evaluation

num_workers: 1               # DDP workers (1-4)
max_wall_time_hours: 8

katib_max_trials: 30
katib_parallel_trials: 5
katib_trial_timeout_hours: 2

serving_min_replicas: 0
serving_max_replicas: 4
serving_target_concurrency: 10
canary_traffic_percent: 0

alert_webhook_url: ""
nll_degradation_threshold: 0.1
da_degradation_threshold: 0.05
nll_absolute_threshold: 3.5     # Must be below this NLL regardless of production
da_absolute_threshold: 0.50     # Must be above this DA regardless of production

schedule_mode: "drift-triggered"  # daily, weekly, on-demand, drift-triggered

training_mode: "scratch"     # scratch or finetune
finetune_epochs: 2           # Epochs when fine-tuning
finetune_learning_rate: 0.0001  # Reduced LR for fine-tuning (10x lower)
