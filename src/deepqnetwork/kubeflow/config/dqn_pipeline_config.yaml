# DQN Pipeline Configuration for Deep Q-Network Forex Trading Agent
# This file provides default values for all pipeline parameters.
# Individual parameters can be overridden at pipeline submission time.

# Environment (modelenv gRPC server connection)
grpc_address: "localhost:50051"
symbol: "USDJPY"
episode_start_ts: 0
episode_end_ts: 0
step_size_seconds: 5

# Agent hyperparameters
# Horizon 1/(1-gamma) ~= 1000 steps to span most of the 1440-step (24h, 60s)
# session incl. end-of-session liquidation. Was 0.99 (~100-step horizon, too
# myopic). NOTE: this is the file the KFP pipeline reads (component.py loads
# kubeflow/config/dqn_pipeline_config.yaml); deepqnetwork/config.yaml is the
# CLI/local default and must be kept in sync.
gamma: 0.999
epsilon_start: 1.0
epsilon_end: 0.05            # sustained exploration floor (~5% random actions throughout)
epsilon_decay_steps: 0       # 0 = auto: anneal over the full step budget (total_episodes x steps/episode)
batch_size: 64
replay_buffer_size: 300000
target_update_freq: 1000
train_freq: 4
tau: 1.0                     # 1.0 = hard copy; <1.0 = soft Polyak averaging

# Network architecture
hidden_dims: [256, 256, 128]
activation: "relu"           # relu, leaky_relu, gelu
dropout: 0.0
learning_rate: 0.0001
betas: [0.9, 0.999]
eps: 0.00000001
weight_decay: 0.0
grad_clip_norm: 10.0
loss_function: "huber"       # huber, mse

# Training schedule
# Episode-count knobs are mode-specific and mutually exclusive, set at most the
# one matching your mode (setting the other is rejected). Left unset = effective
# defaults (3000 fixed-window / 3 date-range).
# num_episodes_per_range: 3000  # fixed-window mode only
# repeats_per_date: 3           # date-range mode only (replays per date)
max_steps_per_episode: 30000
checkpoint_interval: 50

# Infrastructure
num_workers: 1
max_wall_time_hours: 8

# Katib hyperparameter tuning
katib_max_trials: 20
katib_parallel_trials: 3
katib_trial_timeout_hours: 4

# Serving (for dqnpf-intraday combined predictor)
serving_min_replicas: 0
serving_max_replicas: 2
serving_target_concurrency: 5

# Monitoring, absolute thresholds from thesis buy & hold baseline
alert_webhook_url: ""
sharpe_degradation_threshold: 0.1
sharpe_absolute_threshold: 1.0   # Must beat buy & hold baseline (thesis: 1.46)
pnl_absolute_threshold: 0.0     # Must be profitable in absolute terms

# Training mode
training_mode: "scratch"         # scratch or finetune
finetune_learning_rate: 0.00001  # 10x lower than base LR for fine-tuning
finetune_num_episodes_per_range: 500       # Fewer episodes when fine-tuning
