syntax = "proto3";

package environment;

service Environment {
  rpc Reset(ResetRequest) returns (Observation);
  rpc Step(Action) returns (StepResponse);
  rpc ReferenceData(ObserveRequest) returns (Reference);
  rpc StreamObservations(ObserveRequest) returns (stream Observation);
  rpc RecentBars(RecentBarsRequest) returns (RecentBarsResponse);
  rpc RecentTicks(RecentTicksRequest) returns (RecentTicksResponse);
  rpc RecentNews(RecentNewsRequest) returns (RecentNewsResponse);
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_TRAINING = 1;
  MODE_LIVE = 2;
}

enum ActionType {
  ACTION_HOLD = 0;
  ACTION_BUY_1 = 1;
  ACTION_BUY_2 = 2;
  ACTION_SELL_1 = 3;
  ACTION_SELL_2 = 4;
}

enum FillSide {
  FILL_SIDE_BUY = 0;
  FILL_SIDE_SELL = 1;
}

enum TimeInterval {
  TIME_INTERVAL_UNSPECIFIED = 0;
  TIME_INTERVAL_M1 = 1;
  TIME_INTERVAL_M5 = 2;
  TIME_INTERVAL_M15 = 3;
  TIME_INTERVAL_H1 = 4;
  TIME_INTERVAL_H4 = 5;
  TIME_INTERVAL_D1 = 6;
  TIME_INTERVAL_W1 = 7;
  TIME_INTERVAL_MN = 8;
}

message ResetRequest {
  string symbol = 1;
  int64 episode_start_ts = 2;
  int64 episode_end_ts = 3;
  int64 seed = 4;
  int64 step_size_seconds = 5;
}

message ObserveRequest {
  string symbol = 1;
}

message RecentBarsRequest {
  string symbol = 1;
  // Number of most-recent completed bars to return per interval. 0 (unset)
  // falls back to the default RECENT_WINDOW. Consumers needing a deeper
  // lookback (e.g. the forecaster's 1440-bar feature window) set this.
  uint32 count = 2;
}

message RecentBarsResponse {
  map<string, BarList> bars = 1;
}

message RecentTicksRequest {
  string symbol = 1;
}

message RecentTicksResponse {
  // ticks in the 60-second window before live_ticks, sorted latest -> earliest
  repeated Tick ticks = 1;
}

message RecentNewsRequest {
  string symbol = 1;
}

message RecentNewsResponse {
  // news items sorted latest -> earliest, capped at 64
  repeated News news = 1;
}

message Action {
  ActionType action = 1;
  string client_order_id = 2;
}

message Bar {
  int64 timestamp_ns = 1;
  double open = 2;
  double high = 3;
  double low = 4;
  double close = 5;
  double volume = 6;
}

message Position {
  string position_id = 1;
  double entry_price = 2;
  double unrealised_pnl = 3;
  double swap = 4;
  int64 open_timestamp_ns = 5;
  double volume = 6;
  int32 side = 7;  // 0=BUY, 1=SELL
}

message Fill {
  string order_id = 1;
  int64 timestamp_ns = 2;
  double price = 3;
  double size = 4;
  FillSide side = 5;
  bool partial = 6;
}

message News {
  int64 timestamp_ns = 1;
  string headline = 2;
  double sentiment_score = 3;
  string source = 4;
}

message Tick {
  int64 timestamp_ns = 1;
  double bid = 2;
  double ask = 3;
}

message BarList {
  repeated Bar bars = 1;
}

message MomentumIndicators {
  double rsi_14 = 1;
  double cci_14 = 2;
}

message TrendIndicators {
  double adx_14 = 1;
  double macd = 2;
  double macd_signal = 3;
  double macd_hist = 4;
  double sma_10 = 5;
  double sma_20 = 6;
  double sma_50 = 7;
  double ema_10 = 8;
  double ema_20 = 9;
  double ema_50 = 10;
  double ichimoku_tenkan = 11;
  double ichimoku_kijun = 12;
  double ichimoku_senkou_a = 13;
  double ichimoku_senkou_b = 14;
  double ichimoku_chikou = 15;
}

message VolatilityIndicators {
  double bb_upper = 1;
  double bb_middle = 2;
  double bb_lower = 3;
}

message SupportIndicators {
  double fr_000 = 1;
  double fr_236 = 2;
  double fr_382 = 3;
  double fr_500 = 4;
  double fr_618 = 5;
  double fr_786 = 6;
  double fr_1000 = 7;
}

message PatternScores {}

message IntervalIndicators {
  MomentumIndicators momentum = 1;
  TrendIndicators trend = 2;
  VolatilityIndicators volatility = 3;
  SupportIndicators support = 4;
  PatternScores patterns = 5;
}

message DoubleBottomPattern {
  int64 idx1 = 1;
  int64 idx2 = 2;
  int64 ts1 = 3;
  int64 ts2 = 4;
  double low1 = 5;
  double low2 = 6;
  double neckline = 7;
  int64 neckline_idx = 8;
  double depth_pct = 9;
  int64 width_bars = 10;
  bool confirmed = 11;
  double min_before_val = 12;
  int64 min_before_ts = 13;
  double max_before_val = 14;
  int64 max_before_ts = 15;
}

message DoubleTopPattern {
  int64 idx1 = 1;
  int64 idx2 = 2;
  int64 ts1 = 3;
  int64 ts2 = 4;
  double high1 = 5;
  double high2 = 6;
  double neckline = 7;
  int64 neckline_idx = 8;
  double depth_pct = 9;
  int64 width_bars = 10;
  bool confirmed = 11;
  double min_before_val = 12;
  int64 min_before_ts = 13;
  double max_before_val = 14;
  int64 max_before_ts = 15;
}

message Reference {
  int64 timestamp_ns = 1;
  string symbol = 2;
  map<string, Bar> live_bars = 3;
  // positions are sorted latest -> earliest by open_timestamp_ns.
  repeated Position positions = 5;
  // Realised P&L (incl. swap) of positions closed since the most recent
  // trading-session start (renamed from realised_pnl_12m; same field number,
  // so the binary wire format is unchanged).
  double session_realised_pnl = 9;
  // recent_fills holds up to 64 fills sorted latest -> earliest.
  repeated Fill recent_fills = 6;
  // per-interval technical indicators (M1, M5, M15, H1, H4, D1, W1, MN)
  repeated IntervalIndicators ta = 13;
  // detected chart patterns
  repeated DoubleBottomPattern double_bottoms = 14;
  repeated DoubleTopPattern double_tops = 15;
  // MIN(low1, low2) of the most recent confirmed double bottom satisfying
  // MIN(low1, low2) <= tick_ask <= neckline and depth_pct >= 0.15, or 0.0.
  double m15_double_bottom_low = 17;
  // MIN(low1, low2) of the most recent confirmed double bottom satisfying
  // MIN(low1, low2) >= tick_ask, depth_pct >= 0.15, and
  // m15_double_bottom_high - m15_double_bottom_low >= 0.2, or 0.0.
  double m15_double_bottom_high = 18;
  // MAX(high1, high2) of the most recent confirmed double top satisfying
  // MAX(high1, high2) >= tick_bid >= neckline and depth_pct >= 0.15, or 0.0.
  double m15_double_top_high = 19;
  // MAX(high1, high2) of the most recent confirmed double top satisfying
  // MAX(high1, high2) >= tick_bid, depth_pct >= 0.15, and
  // m15_double_top_high - m15_double_top_low >= 0.2, or 0.0.
  double m15_double_top_low = 20;
  // Cyclical time encodings derived from timestamp_ns, each in [-1, 1].
  double sin_hour = 21;
  double cos_hour = 22;
  // Start of the trading session containing timestamp_ns: the most recent
  // instant at or before it where the UTC hour equals the configured
  // trading_session_start_hour (0h UTC when unset). Authoritative session
  // boundary, advances exactly when modelenv rolls to a new session (the same
  // anchor that drives end-of-session liquidation and session_realised_pnl).
  // Consumers detect a new session by this value increasing.
  int64 session_start_ts = 23;
  // live_ticks are ticks since the previous observation, sorted latest -> earliest.
  repeated Tick live_ticks = 11;
  bool done = 8;
  // ordered names of every scalar in a flattened state vector
  repeated string state_columns = 16;
}

// One row of flat feature values in column order.
message StateRow {
  repeated double values = 1;
}

// Flattened observation ready for model consumption.
message Observation {
  // Ordered column names (same order as each StateRow.values).
  repeated string state_columns = 1;
  // Feature matrix: one or more rows, each with values in column order.
  // Multiple rows within a single Observation represent e.g. a sequence
  // of recent states for a sequence model.
  repeated StateRow state_data = 2;
  // Scalar reward for the action that produced this observation.
  // 0.0 for Reset / LiveData.
  double reward = 3;
  // Whether the episode has terminated.
  bool done = 4;
  // Raw change in total equity (unrealised + 12m realised PnL) for the action
  // that produced this observation, in quote-currency price units * volume,
  // BEFORE the reward's penalties, regime z-score normalisation and clipping.
  // This is the un-normalised monetary PnL delta; 0.0 for Reset / LiveData.
  double raw_pnl_delta = 5;
  // Peak margin required in the current episode (sum of volume * entry_price
  // across open positions, divided by leverage).  Resets to 0.0 on Reset(),
  // monotonically increases during the episode.  Units are quote-currency
  // notional / leverage (e.g. JPY / leverage for USDJPY).
  double max_total_margin = 6;
}

message StepResponse {
  Observation data = 1;
  string info = 4;
}
